name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Look v__VERSION__"
          releaseBody: |
            Windows 安装包（NSIS，currentUser 模式，无需管理员权限）。

            安装后从开始菜单启动 Look，默认快捷键：截图 `Ctrl+Alt+A`，录屏 `Ctrl+Alt+R`。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
